name: E2E For SFRA - Template

on:
  workflow_call:
    inputs:
      sfra_version:
        required: true
        type: string
      node_version:
        required: true
        type: string
    secrets:
      SFCC_USERNAME:
        required: true
      SFCC_PASSWORD:
        required: true
      SFCC_HOSTNAME:
        required: true
      SANDBOX_HTTP_AUTH_USERNAME:
        required: true
      SANDBOX_HTTP_AUTH_PASSWORD:
        required: true
      PAYPAL_USERNAME:
        required: true
      PAYPAL_PASSWORD:
        required: true
      AMAZONPAY_USERNAME:
        required: true
      AMAZONPAY_PASSWORD:
        required: true
      GOOGLEPAY_USERNAME:
        required: true
      GOOGLEPAY_PASSWORD:
        required: true
      SFCC_CODE_VERSION:
        required: true
      SFCC_STOREFRONT_URL:
        required: true
      SERVICE_ACCOUNT_SSH_KEY:
        required: true

jobs:
  setup-the-cartridge:
    if: ${{ !startsWith(github.head_ref, 'renovate/') }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout SFRA code
        uses: actions/checkout@v3
        with:
          repository: AdyenAutomationBot/storefront-reference-architecture
          ref: ${{ inputs.sfra_version }}
          ssh-key: ${{ secrets.SERVICE_ACCOUNT_SSH_KEY }}
          path: storefront-reference-architecture
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ inputs.node_version }}
      - name: Checkout
        uses: actions/checkout@v3
        with:
          path: adyen-salesforce-commerce-cloud
      - name: Install SFRA dependencies
        working-directory: storefront-reference-architecture
        run: npm install
      # SFRA 5 and 6 only build on the legacy Node in inputs.node_version, so the
      # toolchain switches to pnpm on Node 20 only after their install finishes.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: adyen-salesforce-commerce-cloud/package.json
      - name: Switch to Node.js 20 for the cartridge build
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install Adyen SFCC dependencies
        working-directory: adyen-salesforce-commerce-cloud
        run: pnpm install --frozen-lockfile
      - name: Create dw.json file
        working-directory: adyen-salesforce-commerce-cloud
        env:
          SFCC_USERNAME: ${{ secrets.SFCC_USERNAME }}
          SFCC_PASSWORD: ${{ secrets.SFCC_PASSWORD }}
          SFCC_HOSTNAME: ${{ secrets.SFCC_HOSTNAME }}
          SFCC_CODE_VERSION: ${{ secrets.SFCC_CODE_VERSION }}
        run: |
          echo '{
            "username": "'"$SFCC_USERNAME"'",
            "password": "'"$SFCC_PASSWORD"'",
            "hostname": "'"$SFCC_HOSTNAME"'",
            "code-version": "'"$SFCC_CODE_VERSION"'"
          }' >> dw.json
      - name: Transpile the code
        working-directory: adyen-salesforce-commerce-cloud
        run: pnpm run transpile
      - name: Compile the code
        working-directory: adyen-salesforce-commerce-cloud
        run: pnpm run compile:js
      - name: Build the cartridge
        working-directory: adyen-salesforce-commerce-cloud
        run: pnpm run uploadCartridge > output-sfra.txt
      - name: Check build result
        working-directory: adyen-salesforce-commerce-cloud
        run: pnpm run check-build:sfra
  end-to-end-testing:
    if: ${{ !startsWith(github.head_ref, 'renovate/') }}
    needs: setup-the-cartridge
    runs-on:
      group: larger-runners
      labels: ubuntu-latest-8-cores
    timeout-minutes: 30
    strategy:
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          path: adyen-salesforce-commerce-cloud
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: adyen-salesforce-commerce-cloud/tests/playwright/package.json
      - name: setup Node 20
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: install e2e test dependencies
        working-directory: adyen-salesforce-commerce-cloud/tests/playwright/
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        working-directory: adyen-salesforce-commerce-cloud/tests/playwright/
        run: pnpm exec playwright install chromium --with-deps
      - name: run e2e tests full coverage
        working-directory: adyen-salesforce-commerce-cloud/tests/playwright/
        if: github.event.pull_request.base.ref == 'main'
        run: pnpm run test:ci
        env:
          SANDBOX_HTTP_AUTH_USERNAME: ${{ secrets.SANDBOX_HTTP_AUTH_USERNAME }}
          SANDBOX_HTTP_AUTH_PASSWORD: ${{ secrets.SANDBOX_HTTP_AUTH_PASSWORD }}
          PAYPAL_USERNAME: ${{ secrets.PAYPAL_USERNAME }}
          PAYPAL_PASSWORD: ${{ secrets.PAYPAL_PASSWORD }}
          AMAZONPAY_USERNAME: ${{ secrets.AMAZONPAY_USERNAME }}
          AMAZONPAY_PASSWORD: ${{ secrets.AMAZONPAY_PASSWORD }}
          SFRA_VERSION: ${{ inputs.sfra_version }}
          SFCC_HOSTNAME: ${{ secrets.SFCC_STOREFRONT_URL }}
      - name: run e2e tests quick coverage
        working-directory: adyen-salesforce-commerce-cloud/tests/playwright/
        if: github.event.pull_request.base.ref != 'main'
        run: pnpm run test:ci:quick
        env:
          SANDBOX_HTTP_AUTH_USERNAME: ${{ secrets.SANDBOX_HTTP_AUTH_USERNAME }}
          SANDBOX_HTTP_AUTH_PASSWORD: ${{ secrets.SANDBOX_HTTP_AUTH_PASSWORD }}
          PAYPAL_USERNAME: ${{ secrets.PAYPAL_USERNAME }}
          PAYPAL_PASSWORD: ${{ secrets.PAYPAL_PASSWORD }}
          AMAZONPAY_USERNAME: ${{ secrets.AMAZONPAY_USERNAME }}
          AMAZONPAY_PASSWORD: ${{ secrets.AMAZONPAY_PASSWORD }}
          SFRA_VERSION: ${{ inputs.sfra_version }}
          SFCC_HOSTNAME: ${{ secrets.SFCC_STOREFRONT_URL }}
      # The config already records a trace per failed test, so the only thing
      # missing when a run fails is somewhere to read it from.
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ inputs.sfra_version }}
          path: |
            adyen-salesforce-commerce-cloud/tests/playwright/test-results/
            adyen-salesforce-commerce-cloud/tests/playwright/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
