# Buy Now, Pay Later (BNPL) checkout disclaimer (EU CCD2 / UK regulation).
# Uncomment and edit to show a disclaimer for BNPL payment methods to shoppers
# in EU/UK markets. Localize by adding bnpl_de.properties, bnpl_fr.properties,
# ... alongside this file; SFCC resolves variants per request locale.
#
# Keys are resolved per payment method (txVariant), most specific first:
#   1. exact txVariant   e.g. disclaimer.message.klarna_account
#   2. method family     e.g. disclaimer.message.klarna (all Klarna variants)
#   3. generic default   disclaimer.message.bnpl
# The whole entry (message + link) is taken from the first level that defines
# a message. %{link} in the message is replaced by linkText, linking to link.
#
# Generic default for all BNPL methods:
#disclaimer.message.bnpl=Caution! Borrowing money costs money. See %{link}
#disclaimer.linkText.bnpl=more information
#disclaimer.link.bnpl=https://www.example.com/bnpl-terms
#
# Family override (klarna, klarna_account, klarna_paynow, ...):
#disclaimer.message.klarna=Caution! Borrowing money costs money. See %{link}
#disclaimer.linkText.klarna=Klarna terms
#disclaimer.link.klarna=https://www.example.com/klarna-terms
#
# Exact txVariant override:
#disclaimer.message.facilypay_3x=Caution! Borrowing money costs money.
